# ============================================================
# UCOM Common Kernel Configuration
# Supported Machines:
# - mtk-ucom-m510 (MT8370)
# - mtk-ucom-m700 (MT8390)
# ============================================================

# Audio - TLV320AIC3X
CONFIG_SND_SOC_TLV320AIC3X_I2C=m
CONFIG_SND_SOC_TLV320AIC3X=m
CONFIG_SND_SOC_FSL_SAI=y

# RTC - PCF85063
CONFIG_RTC_DRV_PCF85063=y

# WWAN - QMI
CONFIG_USB_NET_QMI_WWAN=y

# Filesystem - NTFS
CONFIG_NTFS_FS=m
CONFIG_NTFS3_FS=m

# Realtek Wireless
CONFIG_RTW88=y
CONFIG_RTW89=y

# EEPROM
CONFIG_EEPROM_AT24=y

# TPM (SPI)
CONFIG_HW_RANDOM=y
CONFIG_TCG_TPM=y
CONFIG_TCG_TIS=m
CONFIG_TCG_TIS_SPI=y