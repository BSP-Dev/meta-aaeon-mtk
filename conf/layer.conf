# Add layer to BBPATH
BBPATH .= ":${LAYERDIR}"

# Recipe and bbappend search paths
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Layer collection
BBFILE_COLLECTIONS += "mtk-ucom"

BBFILE_PATTERN_mtk-ucom = "^${LAYERDIR}/"
BBFILE_PRIORITY_mtk-ucom = "12"

# Layer version
LAYERVERSION_mtk-ucom = "1"

# Layer dependencies
LAYERDEPENDS_mtk-ucom = "core mediatek-bsp"

# Yocto release compatibility
LAYERSERIES_COMPAT_mtk-ucom = "scarthgap"