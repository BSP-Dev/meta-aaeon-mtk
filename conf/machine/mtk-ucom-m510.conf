# UCOM M510 - MediaTek MT8370
# Based on Genio 510 EVK

require conf/machine/mt8370-evk.conf

# OP-TEE - 8GB DRAM
OPTEE_DRAM_SIZE:mtk-ucom-m510 = "0x200000000"

# Kernel - customize later
KERNEL_DEVICETREE = "mediatek/mt8370-genio-510-evk-ucom-m510.dtb"

# Custom Display DTBO
KERNEL_DEVICETREE_OVERLAYS_AUTOLOAD:remove = " \
    display-dsi.dtbo \
"